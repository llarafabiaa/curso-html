<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>E-commerce</title>
  </head>
  <body>
    <header><h1>Página Principal</h1></header>
    <main class="container">
      <article class="card">
        <img
          class="card-imagem"
          src="fone de ouvido.png"
          alt="Imagem do Produto"
        />
        <div class="card-conteudo">
          <h2>Fone Bluetooth</h2>
          <p>Fone sem fio: Confortável e com Bateria de Longa Duração</p>
          <p class="preco">R$ 279,90</p>
          <button>Comprar</button>
        </div>
      </article>
    </main>

    <footer><p>Todos os direitos reservados - Lara Fábia</p></footer>
  </body>
</html>

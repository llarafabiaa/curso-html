<!doctype html>
<html lang="pt-BR">
  <!-- metas, link, tittle, conecta arquivos -->
  <head>
    <!-- metas - SEO -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- style - css -->
    <link rel="stylesheet" href="style.css" />

    <!-- title -->
    <title>CSS | HTML</title>
  </head>

  <!-- corpo do documento - o que aparece no navegador(DOM) -->
  <body>
    <!-- cabeçalho -->
    <header>
      <h1>Cabeçalho</h1>
    </header>

    <!-- Principal -->
    <main>
      <!-- navegação -->
      <nav>
        <div>
          <a href="#">Sessão 1</a>
          <a href="#">Sessão 2</a>
          <a href="#">Sessão 3</a>
        </div>
      </nav>

      <h1>Áreas do HTML</h1>
      <section>Sessão 1</section>
      <section>Sessão 2</section>
      <section>Sessão 3</section>
    </main>

    <!-- rodapé -->
    <footer>
      <p>Todos os direitos reservados - Lara Fábia</p>
    </footer>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table | Lista | Textarea | Input</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Cabeçalho -->
    <header>
      <h1>Aprendendo Sobre Fundamentos de Lista e Tabelmas</h1>
    </header>

    <!-- Conteúdo Principal -->
    <main>
      <!-- Primeira Sessão -->
      <section>
        <!-- Lista Ordenada -->
        <div class="lista-ordenada">
          <h2>Lista Ordenada</h2>
          <ol type="A">
            <li>Maçã</li>
            <li>Morango</li>
            <li>Banana</li>
          </ol>
        </div>

        <!-- Lista Não Ordenada -->
        <div class="lista-nao-ordenada">
          <h2>Lista Não Ordenada</h2>
          <ul>
            <li>Gato</li>
            <li>Raposa</li>
            <li>Panda</li>
          </ul>
        </div>
      </section>

      <!-- Segunda Sessão -->
      <section>
        <!-- Tabela -->
        <table class="tabela">
          <!-- Cabeçalho -->
          <thead>
            <tr class="cabecalho">
              <th>ID</th>
              <th>Fruta</th>
              <th>Valor</th>
            </tr>
          </thead>

          <!-- Corpo | Conteúdo -->
          <tbody>
            <tr>
              <td>1</td>
              <td>Maça</td>
              <td>R$ 50,00</td>
            </tr>

            <tr>
              <td>2</td>
              <td>Morango</td>
              <td>R$ 70,00</td>
            </tr>

            <tr>
              <td>1</td>
              <td>Banana</td>
              <td>R$ 90,00</td>
            </tr>
          </tbody>
        </table>
      </section>
      <section>
        <h2>Entre em contato e saiba mais</h2>
        <div class="grupo">
          <label for="mensagens"> Deixe sua mensagem! </label>
          <textarea
            placeholder="Digite o seu comentário"
            name="mensagens"
            id="mensagem"
          ></textarea>
        </div>
      </section>
    </main>

    <!-- Footer - Rodapé -->
    <!-- <footer>Todos os direitos reservados</footer> -->
  </body>
</html>
